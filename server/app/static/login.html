<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collect your order</title>
<style>
  :root { --ink:#16222b; --muted:#5d6b75; --bg:#eef3f1; --card:#fff; --accent:#0b6e5a; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6eeea; --muted:#9db0a8; --bg:#10181a; --card:#182224; --accent:#4cc3a6; --bad:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main { width:100%; max-width:380px; background:var(--card); padding:24px; border-radius:10px; }
  h1 { font-size:1.35rem; margin:0 0 4px; }
  p.hint { margin:0 0 20px; color:var(--muted); }
  label { display:block; margin-top:14px; font-weight:600; }
  input { width:100%; padding:12px; margin-top:4px; font-size:1rem; border:1px solid var(--muted);
          border-radius:6px; background:transparent; color:inherit; }
  input:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  button { width:100%; margin-top:22px; padding:14px; font-size:1rem; font-weight:600; border:0;
           border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; }
  #msg { margin-top:16px; min-height:1.5em; font-weight:600; }
  #msg.err { color:var(--bad); } #msg.ok { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Collect your order</h1>
  <p class="hint">Sign in with your university account to open your compartment.</p>
  <div>
    <label for="uid">University ID</label>
    <input id="uid" placeholder="Student, lecturer or employee ID" autocomplete="username" inputmode="text">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="go">Open my compartment</button>
    <div id="msg" role="status"></div>
  </div>
</main>
<script>
const qr = new URLSearchParams(location.search).get("t");
const $ = id => document.getElementById(id);
const say = (t, cls) => { $("msg").textContent = t; $("msg").className = cls || ""; };
if (!qr) say("No QR code found. Scan the code on the robot.", "err");

async function call(url, body, token) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || "Request failed");
  return data;
}

$("go").onclick = async () => {
  $("go").disabled = true; say("Checking…");
  try {
    const { access_token, role } = await call("/api/auth/login",
      { user_id: $("uid").value.trim(), password: $("pw").value, qr_token: qr });

    if (role !== "recipient") {
      say(role === "staff"
        ? "Signed in as canteen staff. Loading by QR is not available yet, please use the dispatch page."
        : "Admins do not collect orders. Please use the dispatch page.", "ok");
      $("go").disabled = false;
      return;
    }
    
    const res = await call("/api/unlock", null, access_token);
    say(res.message + ". Take your order and close the door.", "ok");
  } catch (e) {
    say(e.message, "err"); $("go").disabled = false;
  }
};
</script>
</body>
</html>
