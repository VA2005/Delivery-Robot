<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch</title>
<style>
  :root { --ink:#1b2430; --muted:#66727f; --bg:#f4f5f7; --card:#fff; --line:#d9dde3; --accent:#1f4fd8; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8ebf0; --muted:#98a3b0; --bg:#12161c; --card:#1a2028; --line:#2c3541; --accent:#7ea0ff; --bad:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  .wrap { max-width:760px; margin:0 auto; display:grid; gap:16px; }
  section { background:var(--card); padding:18px; border-radius:8px; border:1px solid var(--line); }
  h1 { font-size:1.3rem; margin:0; } h2 { font-size:1.05rem; margin:0 0 12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1 1 140px; padding:10px; border:1px solid var(--line); border-radius:6px; font:inherit;
          background:transparent; color:inherit; }
  button { padding:10px 16px; border:0; border-radius:6px; background:var(--accent); color:#fff;
           font:inherit; font-weight:600; cursor:pointer; }
  button.link { background:none; color:var(--accent); padding:4px 8px; border:1px solid var(--line); }
  input:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #msg { margin-top:10px; min-height:1.4em; color:var(--muted); } #msg.err { color:var(--bad); }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dispatch</h1>

  <section id="loginBox">
    <h2>Sign in</h2>
    <div class="row">
      <input id="uid" placeholder="Admin or staff ID" autocomplete="username">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn">Sign in</button>
    </div>
  </section>

  <section id="orderBox" hidden>
    <h2>Create delivery order</h2>
    <div class="row">
      <input id="rid" placeholder="Recipient ID">
      <input id="details" placeholder="Order details">
      <button id="createBtn">Create order</button>
    </div>
  </section>

  <section id="listBox" hidden>
    <h2>Orders</h2>
    <div class="scroll"><table>
      <thead><tr><th>ID</th><th>Recipient</th><th>Box</th><th>Status</th><th>Details</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>

  <div id="msg" role="status"></div>
</div>
<script>
let token = null;
const $ = id => document.getElementById(id);
const say = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };

async function api(url, method, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json",
    ...(token ? { Authorization: "Bearer " + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || "Request failed");
  return data;
}

async function refresh() {
  const orders = await api("/api/orders", "GET");
  $("rows").innerHTML = "";
  for (const o of orders) {
    const tr = document.createElement("tr");
    for (const v of [o.id, o.recipient_id, o.compartment, o.status, o.details]) {
      const td = document.createElement("td"); td.textContent = v; tr.appendChild(td);
    }
    const td = document.createElement("td");
    if (o.status === "CREATED") {
      const b = document.createElement("button"); b.className = "link"; b.textContent = "Mark loaded";
      b.onclick = async () => { try { await api(`/api/orders/${o.id}/loaded`, "POST"); await refresh(); }
                                catch (e) { say(e.message, true); } };
      td.appendChild(b);
    }

        if (o.status === "UNLOCKED") {
      const b = document.createElement("button"); b.className = "link"; b.textContent = "Mark collected";
      b.onclick = async () => { try { await api(`/api/orders/${o.id}/complete`, "POST"); await refresh(); }
                                catch (e) { say(e.message, true); } };
      td.appendChild(b);
    }
    tr.appendChild(td); $("rows").appendChild(tr);
  }
}

$("loginBtn").onclick = async () => {
  try {
    const d = await api("/api/auth/login", "POST", { user_id: $("uid").value.trim(), password: $("pw").value });
    token = d.access_token;
    $("loginBox").hidden = true; $("listBox").hidden = false; $("orderBox").hidden = d.role !== "admin";
    say("Signed in as " + d.role); await refresh();
  } catch (e) { say(e.message, true); }
};

$("createBtn").onclick = async () => {
  try {
    const d = await api("/api/orders/create", "POST", { recipient_id: $("rid").value.trim(), details: $("details").value });
    say(`Order ${d.order_id} created, compartment ${d.compartment} reserved`); await refresh();
  } catch (e) { say(e.message, true); }
};
</script>
</body>
</html>
